# The dashboard,
# http://dashboard.local/ once that name resolves.
#
# default_server means this block also answers requests that arrive by the Pi's
# bare IP or any other name, so the dashboard is reachable before any DNS exists.
# When real sites arrive, move default_server to a block that returns 404, so
# the Pi stops answering to names nobody configured.
server {
    listen 80 default_server;
    server_name dashboard.local;

    location / {
        # Docker's built-in DNS server, which resolves container names.
        resolver 127.0.0.11 valid=30s;

        set $upstream_host dashboard;
        proxy_pass http://$upstream_host:8000$request_uri;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
